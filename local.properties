# Lokales Android-SDK für dieses Projekt.
#
# Der Pfad ist relativ zum Projektwurzelverzeichnis. Beim ersten Build lädt
# das Android Gradle Plugin fehlende Pakete (Plattform 33 und Build-Tools 36)
# automatisch in dieses Verzeichnis, sofern die Lizenz unter
# sdk/licenses/android-sdk-license akzeptiert ist.
#
# Wer ein vorhandenes SDK verwenden möchte, trägt hier stattdessen den
# absoluten Pfad ein, z. B.:
#   sdk.dir=/home/benutzer/Android/Sdk
sdk.dir=sdk
