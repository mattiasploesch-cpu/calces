org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=false

# AndroidX ist in der deobfuskierten Bibliothek bereits enthalten.
android.useAndroidX=true
# Die App-Quellen greifen auch auf Ressourcen der mitgelieferten
# Bibliotheken zu, daher den transitiven R-Klassenmodus beibehalten.
android.nonTransitiveRClass=false
